{% set name = "vira" %}
{% set version = "0.2.0.dev5" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/malabz/vira/archive/df2a8a1f1183fd36c4daed743ff2614f4d6375ca.tar.gz
  sha256: cb841a50855f93ded66057b1fe32f3da66d732d26e3a9b3b7a17c985158ecf02
  patches:
    - 0001-honor-ldflags.patch

build:
  number: 0
  skip: true  # [not linux]

requirements:
  build:
    - {{ compiler('cxx') }}
    - make
  run:
    - mafft >=7

test:
  commands:
    - vira --help
  requires:
    - grep

about:
  home: https://github.com/malabz/vira
  dev_url: https://github.com/malabz/vira
  summary: Scalable and auditable MAFFT-based reference-coordinate alignment workflow for viral genomes
  description: |
    ViRA generates fixed-reference-coordinate multiple sequence alignments for
    large viral consensus-sequence datasets. It adds streaming input screening,
    bounded parallel MAFFT execution, structured audit reports, and optional
    MAFFT mapout projection-loss quality control.
  license: NOASSERTION
  license_family: OTHER

extra:
  recipe-maintainers:
    - malabz
