name: Build Conda package for Linux

on:
  push:
    branches:
      - codex/conda-linux-package
    paths:
      - conda-recipe/**
      - .github/workflows/build-conda-linux.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-64:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out recipe
        uses: actions/checkout@v4

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: conda-build-env
          python-version: "3.12"
          channels: conda-forge,bioconda
          channel-priority: strict

      - name: Install build tooling
        run: conda install --yes conda-build anaconda-client

      - name: Build and test linux-64 package
        run: conda build conda-recipe --output-folder dist --channel conda-forge --channel bioconda

      - name: List package artifacts
        run: find dist/linux-64 -maxdepth 1 -type f -print

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: vira-linux-64
          path: |
            dist/linux-64/*.conda
            dist/linux-64/*.tar.bz2
          if-no-files-found: error
